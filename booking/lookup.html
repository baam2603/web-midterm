<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,680&family=Be+Vietnam+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../common/header.css" />
    <link rel="stylesheet" href="../common/footer.css" />
    <link rel="stylesheet" href="../common/extension.css" />
    <title>Tra cứu đặt phòng | THREEK.COM</title>
  </head>
  <body>
    <header id="site-header"></header>
    <main class="tk-page">
      <div class="tk-container tk-container--narrow">
        <span class="tk-eyebrow">ĐẶT PHÒNG KHÔNG CẦN TÀI KHOẢN</span>
        <h1>Tra cứu đơn đặt phòng</h1>
        <p class="tk-lead">
          Nhập đủ mã đặt phòng, email và số điện thoại đã dùng khi đặt. Chỉ tra
          cứu được đơn của khách chưa đăng nhập trong bản demo trên trình duyệt
          này.
        </p>
        <div class="tk-surface">
          <form class="tk-form" id="tk-lookup-form">
            <label
              >Mã đặt phòng<input
                name="code"
                autocomplete="off"
                required
                maxlength="80"
                placeholder="Ví dụ: 3K..." /></label
            ><label
              >Email đặt phòng<input
                type="email"
                name="email"
                required /></label
            ><label
              >Số điện thoại đặt phòng<input type="tel" name="phone" required
            /></label>
            <p id="tk-lookup-status" class="tk-feedback" role="status"></p>
            <button class="tk-primary">Tra cứu đơn</button>
          </form>
        </div>
        <nav class="tk-nav">
          <a href="myBooking.html">Đặt phòng của tôi</a
          ><a href="../support/index.html">Cần hỗ trợ?</a>
        </nav>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <script src="../common/auth-service.js"></script>
    <script src="../common/header.js"></script>
    <script src="../common/footer.js"></script>
    <script>
      mountHeader("site-header");
      mountFooter("site-footer");
    </script>
    <script src="../common/booking-store.js"></script>
    <script src="../common/domain-store.js"></script>
    <script src="lookup.js"></script>
  </body>
</html>
