<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,680&family=Be+Vietnam+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../common/header.css" />
    <link rel="stylesheet" href="../common/footer.css" />
    <link rel="stylesheet" href="../common/extension.css" />
    <title>Tra cứu đặt phòng | THREEK.COM</title>
  </head>
  <body>
    <header id="site-header"></header>
    <main class="tk-page">
      <div class="tk-container tk-container--narrow">
        <span class="tk-eyebrow">TRA CỨU ĐƠN CỦA BẠN</span>
        <h1>Tra cứu đơn đặt phòng</h1>
        <p class="tk-lead">
          Đăng nhập bằng tài khoản đã đặt phòng và nhập mã đơn. Chỉ chủ tài
          khoản được xem thông tin đặt phòng.
        </p>
        <div class="tk-surface">
          <form class="tk-form" id="tk-lookup-form">
            <label
              >Mã đặt phòng<input
                name="code"
                autocomplete="off"
                required
                maxlength="80"
                placeholder="Ví dụ: 3K..."
            /></label>
            <p id="tk-lookup-status" class="tk-feedback" role="status"></p>
            <button class="tk-primary">Tra cứu đơn</button>
          </form>
        </div>
        <nav class="tk-nav">
          <a href="myBooking.html">Đặt phòng của tôi</a
          ><a href="../support/index.html">Cần hỗ trợ?</a>
        </nav>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <script src="../common/auth-service.js?v=20261105-security1"></script>
    <script src="../common/header.js"></script>
    <script src="../common/footer.js"></script>
    <script>
      mountHeader("site-header");
      mountFooter("site-footer");
    </script>
    <script src="lookup.js"></script>
  </body>
</html>
