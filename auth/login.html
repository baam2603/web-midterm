<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Threek Booking</title>
    <!-- Nạp Bootstrap trước -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <!-- Nạp CSS tùy chỉnh sau để không bị ghi đè -->
    <link rel="stylesheet" href="styleLogin.css" />
</head>
<body>
    <div class="register-container">
        <div class="register-header mb-4">
            <h2 class="font-weight-bold" style="font-size: 28px; color: #1c1e21;">Đăng nhập vào Threek Booking</h2>
        </div>

        <div class="register-body">
            <form action="#" method="POST" class="needs-validation" novalidate>
                <div class="form-group mb-3">
                    <label for="email">Nhập Email của bạn</label>
                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="example@gmail.com"
                        required
                    />
                    <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>
                </div>

                <div class="form-group mb-4">
                    <label for="password">Mật khẩu</label>
                    <div class="pass-wrap">
                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder=""
                            required
                        />
                        <button type="button" class="password-eye-button" aria-label="Hiện mật khẩu" aria-pressed="false" aria-controls="password"><img src="../sources/eye-close.png" alt="" class="toggle-password" id="eyeicon" /></button>
                    </div>
                    <div class="invalid-feedback">Vui lòng nhập mật khẩu.</div>
                </div>

                <div class="custom-error-text mb-3">Sai tài khoản hoặc mật khẩu</div>

                <div class="form-group mb-3">
                    <button type="submit" class="btn-submit">Đăng nhập</button>
                </div>

                <div class="form-group mb-3 text-center">
                    <button type="button" class="btn-forgot-pass" onclick="window.location.href='forgot.html'">
                        Quên mật khẩu
                    </button>
                </div>

                <div class="form-group mb-0 text-center">
                    <button type="button" class="btn-register" onclick="window.location.href='register.html'">
                        Tạo tài khoản mới
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Thư viện JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Giữ nguyên các script kết nối Backend của project -->
    <script src="../common/auth-service.js"></script>
    <script src="login.js"></script>
</body>
</html>
