<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo tài khoản</title>
    <link rel="stylesheet" href="styleRegister.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>

<body>
    <div class="register-container">
        <div class="register-header">
            <h2>Nhập thông tin để tạo tài khoản</h2>
            <p></p>
        </div>

        <div class="register-body">
            <form action="#" method="POST" class="needs-validation">
                <div class="form-group">
                    <label for="username">Họ và tên</label>
                    <div class="name-row">
                        <input type="text" id="text_ho" class="form-control" placeholder="Họ" required>
                        <input type="text" id="text_ten" class="form-control" placeholder="Tên" required>
                    </div>
                </div>
                <br>

                <div class="form-group">
                    <label for="dateofbirth">Ngày tháng năm sinh</label>
                    <div class="birth-select">
                        <select id="day-select" class="form-control" required>
                            <option value="" disabled selected>Day</option>
                        </select>

                        <select class="form-control" id="month-select" required>
                            <option value="" disabled selected>Month</option>
                        </select>

                        <select class="form-control" id="year-select" required>
                            <option value="" disabled selected>Year</option>
                        </select>
                    </div>
                </div>
                <br>

                <div class="form-group">
                    <label for="gender">Giới tính</label>
                    <div class="birth-select">
                        <select class="form-control" required>
                            <option value="" disabled selected>Chọn giới tính</option>
                            <option value="male">Nam</option>
                            <option value="female">Nữ</option>
                        </select>
                    </div>
                </div>
                <br>

                <div class="form-group">
                    <label for="email">Email của bạn</label>
                    <input type="email" id="email" class="form-control" placeholder="123@gmail.com" required>
                </div>
                <br>

                <div class="form-group">
                    <label for="sdt">Số điện thoại</label>
                    <input type="text" id="text" class="form-control" placeholder="" required>
                </div>
                <br>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="" required>
                </div>
                <br>
                <div class="form-group">
                    <label for="confirm_password">Xác nhận mật khẩu</label>
                    <input type="password" id="confirm_password" class="form-control" placeholder="" required>
                </div>
                <br>
                <div class="form-group">
                    <button type="submit" class="btn-submit">Gửi</button>
                </div>
                <br>
                <div class="form-group">
                    <button type="submit" class="btn-already-have">Tôi đã có tài khoản</button>
                </div>
            </form>
        </div>
    </div>
    <script src="registerScript.js"></script>
</body>

</html>
