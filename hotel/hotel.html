<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết khách sạn | THREEK.COM</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,680&family=Be+Vietnam+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="hotel.css" />
  </head>
  <body data-city="dalat">
    <!-- ================= HEADER ================= -->
    <header id="site-header"></header>

    <!-- ================= NỘI DUNG (hotel.js đổ dữ liệu vào đây) ================= -->
    <main class="hotel-page" id="hotel-root"></main>

    <!-- ================= LIGHTBOX ẢNH ================= -->
    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox__close" id="lbClose" aria-label="Đóng">
        <i class="material-symbols-rounded">close</i>
      </button>
      <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Ảnh trước">
        <i class="material-symbols-rounded">chevron_left</i>
      </button>
      <div class="lightbox__stage">
        <img id="lbImg" alt="" />
        <span class="lightbox__count" id="lbCount"></span>
      </div>
      <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Ảnh sau">
        <i class="material-symbols-rounded">chevron_right</i>
      </button>
    </div>

    <script src="header.js"></script>
    <script src="hotel-data.js"></script>
    <script src="hotel.js"></script>
    <script src="auth-service.js"></script>
  </body>
</html>
