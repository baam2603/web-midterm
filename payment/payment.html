<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán | THREEK.COM</title>

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,680&family=Be+Vietnam+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../common/header.css" />
    <link rel="stylesheet" href="../common/footer.css" />
    <link rel="stylesheet" href="../hotel/Booking.css" />
    <link rel="stylesheet" href="payment.css" />
    <link rel="stylesheet" href="../common/extension.css" />
  </head>
  <body data-city="dalat">
    <header id="site-header"></header>

    <div class="tk-alert" style="max-width: 950px; margin: 15px auto">
      Đơn được lưu trên hệ thống sau khi xác nhận. Bạn thanh toán tại khách sạn
      theo chính sách đặt phòng.
    </div>
    <main class="booking-page" id="pay-root"></main>

    <footer id="site-footer"></footer>
    <script src="../common/auth-service.js?v=20261104-session2"></script>
    <script src="../common/header.js"></script>
    <script src="../common/footer.js"></script>
    <script>
      mountFooter("site-footer");
    </script>
    <script src="../common/city-data.js"></script>
    <script src="../hotel/hotel-data.js"></script>
    <script src="../hotel/hotel-detail-api.js"></script>
    <script>
      (async () => {
        const root = document.getElementById("pay-root");
        try {
          const draft = JSON.parse(
            sessionStorage.getItem("threek_checkout") || "null",
          );
          if (!draft)
            throw Error(
              "Phiên thanh toán đã hết hạn. Vui lòng chọn phòng lại.",
            );
          await loadProfile();
          await HotelDetailAPI.sync(draft);
          const script = document.createElement("script");
          script.src = "payment.js";
          document.body.append(script);
        } catch (error) {
          root.textContent = error.message;
        }
      })();
    </script>
  </body>
</html>
